[alias]
xtask = ["run", "--locked", "--manifest-path", "tools/xtask/Cargo.toml", "--target", "host-tuple", "--"]

[target.'cfg(target_os = "none")']
rustflags = ["-C", "link-args=-Tkernel/linker.ld"]
runner = ["mise", "run", "cargo:run", "--"]

[build]
target = "x86_64-unknown-none"
target-dir = "target"

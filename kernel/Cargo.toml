[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
kernel_core = { path = "../kernel_core" }
spin = "0.12.3"
uuid = { version = "1.11.1", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
kernel_api = { path = "../kernel_api", default-features = false }

[dev-dependencies]
kernel_core = { path = "../kernel_core", features = ["test-support"] }
test-macros = { path = "../tools/test-macros" }
